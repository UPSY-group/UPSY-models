name: LADDIE Test Suite - compile and cache LADDIE (development build) on MacOS
run-name: ${{ github.actor }} - LADDIE Test Suite - compile and cache LADDIE (development build) on MacOS
on:
  workflow_call:
  workflow_dispatch:

jobs:
  compile_LADDIE_dev:
    runs-on: macos-latest
    steps:

      - name: Install packages with Homebrew   # Packages end up in /opt/homebrew/Cellar
        run: |
          #brew install gcc                    # Not needed on GitHub server, already installed
          brew install open-mpi
          brew install petsc
          brew unlink hdf5-mpi                 # To fix the following conflict: "hdf5-mpi: because hdf5-mpi is a variant of hdf5, one can only use one or the other"
          brew install netcdf
          brew install netcdf-fortran
          #brew install cmake                  # Not needed, already installed
          #brew install ninja

      - name: Set up Fortran compiler          # See: https://github.com/marketplace/actions/setup-fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gcc
          version: 15

      - name: Verify compiler setup
        run: gfortran --version

      - name: Set PKG_CONFIG_PATH
        shell: micromamba-shell {0}
        run: echo "PKG_CONFIG_PATH=${CONDA_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update submodules
        run: |
          git submodule update --init --remote

      - name: Compile LADDIE
        run: ./compile_LADDIE.csh  dev  clean

      - name: Cache LADDIE unit test program
        uses: actions/cache/save@v3
        id: LADDIE_program_cache_save
        with:
          path: LADDIE_program
          key: LADDIE_program_dev_macos_${{ github.ref_name }}_${{ github.run_id }}
