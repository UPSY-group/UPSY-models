name: upsy
channels:
  - conda-forge
dependencies:
  # Core python
  - python=3.12
  - numpy=2.4.3
  - netcdf4=1.7.4
  - h5py

  # Stuff to compile models
  - openmpi=5.0.10
  - petsc=3.25.5
  - netcdf-fortran=4.6.2
  - libnetcdf=4.10.0

  # Pin the BLAS implementation and version, so CI and the machine that generated
  # the reference results use the same floating-point kernels
  - libblas=*=*openblas
  - libopenblas=0.3.34=openmp*

  - gfortran
  - compilers
  - cmake
  - ninja
